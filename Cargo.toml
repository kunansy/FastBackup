[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.7"
edition = "2024"
rust-version = "1.99"
authors = ["Kirill <k@kunansy.ru>"]
license = "MIT"

[workspace.dependencies]
backup-core = { path = "crates/backup-core" }
backup-pg = { path = "crates/backup-pg" }
backup-gdrive = { path = "crates/backup-gdrive" }
backup-proto = { path = "crates/backup-proto" }

async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
env_logger = "0.11"
google-drive3 = { version = "7", features = ["yup-oauth2-service-account"] }
http-body-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring"] }
log = "0.4"
prost = "0.14"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process", "io-util"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
zstd = "0.14"

[profile.release]
# fat lto: https://doc.rust-lang.org/cargo/reference/profiles.html#lto
lto = "fat"
opt-level = 3
