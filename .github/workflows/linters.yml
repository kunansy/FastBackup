name: Linters

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Runners may lack AVX-512; drop the production target-cpu from .cargo/config.toml.
      RUSTFLAGS: ""
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      run: |
        rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
        rustup default 1.99.1

    - name: Install packages
      run: |
        sudo apt-get install -y protobuf-compiler postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18

    - name: Toolchain info
      run: |
        cargo --version --verbose
        rustc --version

    - name: Format
      run: cargo fmt --all --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --offline -- -D warnings

    - name: Test
      env:
        PG_TEST_HOST: localhost
        PG_TEST_PORT: "5432"
        PG_TEST_USER: postgres
        PG_TEST_PASSWORD: postgres
      run: |
        export PATH=/usr/lib/postgresql/18/bin:$PATH
        cargo test --workspace --offline -- --include-ignored

    - name: Build
      run: cargo build --workspace --release --offline --jobs $(nproc)
